name: Terraform CI/CD

on:
  push:
    branches:
      - week5                # Only trigger on week5 branch
    tags:
      - 'v*.*.*'             # Only trigger on version tags (e.g., v1.0.0)
    paths:
      - 'Day21/**'           # Only trigger if changes are made in Day21/

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORMCLOUD }}

      - name: Terraform Init
        working-directory: Day21
        run: terraform init

      - name: Terraform Validate
        working-directory: Day21
        run: terraform validate

  deploy:
    name: Deploy to Terraform Cloud
    if: startsWith(github.ref, 'refs/tags/v')      # Only run on version tag pushes
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORMCLOUD }}

      - name: Terraform Init
        working-directory: Day21
        run: terraform init

      - name: Terraform Apply
        working-directory: Day21
        run: terraform apply -auto-approve

    deploy-to-terraform-cloud:
      name: Deploy to Terraform Cloud
      if: startsWith(github.ref='refs/heads/week5')      # Only run on version tag pushes
      needs: validate
      runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TERRAFORMCLOUD }}

      - name: Terraform Init
        working-directory: Day21
        run: terraform init

      - name: Terraform Apply
        working-directory: Day21
        run: terraform apply -auto-approve

